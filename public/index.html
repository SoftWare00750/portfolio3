<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1724" />
    <meta
      name="description"
      content="Steph's — Frontend Dev Portfolio"
    />
    <meta property="og:title" content="Steph's — Portfolio" />
    <meta
      property="og:description"
      content="Showcasing my work in Frontend Development."
    />
    <meta property="og:image" content="%PUBLIC_URL%/assets/about.png" />
    <meta property="og:type" content="website" />
    <title>Steph's | Portfolio</title>

    <!-- Apply the remembered theme (light by default) before first paint,
         including on the loading screen, so there's no flash of the wrong
         theme while React boots. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("theme");
          if (stored === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {
          /* localStorage unavailable - default (light) theme applies */
        }
      })();
    </script>

  <!-- Fonts -->

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Graffiti display font (replaces "Sprite Graffiti").
      "Sprite Graffiti" itself is a paid Fontfabric typeface that was previously
      pulled from fonts.cdnfonts.com — that CDN serves it unreliably and the
      glyphs render as a hollow/shadowed outline (looks "transparent") instead
      of a solid fill. Permanent Marker is a genuine graffiti/marker-tag style
      Google Font: fully solid, clearly legible at any size, and served
      reliably from Google's own CDN with no local font files needed.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- React app mounts here -->
    <div id="root"></div>
  </body>
</html>
